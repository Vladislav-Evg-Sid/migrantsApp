services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: migrants_db
      POSTGRES_USER: migrants
      POSTGRES_PASSWORD: migrants
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migrants -d migrants_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
